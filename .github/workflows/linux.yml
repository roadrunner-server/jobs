name: jobs

on:
  push:
    branches:
      - master
      - stable
  pull_request:
    branches:
      - master
      - stable

jobs:
  rr_jobs_test:
    name: JOBS plugin (Go ${{ matrix.go }}, PHP ${{ matrix.php }}, OS ${{matrix.os}})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        php: ["8.5"]
        go: [stable]
        os: ["ubuntu-latest"]
    steps:
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7 # action page: <https://github.com/actions/setup-go>
        with:
          go-version: ${{ matrix.go }}
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2 # action page: <https://github.com/shivammathur/setup-php>
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets
      - name: Check out code
        uses: actions/checkout@v7
      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          cd tests/php_test_files
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Init Composer Cache # Docs: <https://git.io/JfAKn#php---composer>
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install Composer dependencies
        run: cd tests/php_test_files && composer update --prefer-dist --no-progress --ansi
      - name: Init Go modules Cache # Docs: <https://git.io/JfAKn#go---modules>
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-
      - name: Create folders
        run: |
          mkdir ./tests/coverage-ci
      - name: Install Go dependencies
        run: go mod download
      - name: Run JOBS unit tests with coverage
        run: |
          go test -timeout 20m -v -race -cover -coverpkg=./... -coverprofile=./tests/coverage-ci/jobsu.out -covermode=atomic ./...
      - name: Run golang tests with coverage
        env:
          RR_JOBS_STRICT_ENV: "1"
        run: |
          cd tests

          docker compose -f env/docker-compose-jobs.yaml up -d

          # wait for the brokers that only answer on a plain tcp port
          for addr in 127.0.0.1:4222 127.0.0.1:11300; do
            ok=0
            for _ in $(seq 60); do
              if timeout 1 bash -c "cat < /dev/null > /dev/tcp/${addr%:*}/${addr#*:}" 2>/dev/null; then
                ok=1; break
              fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$addr not reachable after 120s"
              docker compose -f env/docker-compose-jobs.yaml logs
              exit 1
            fi
          done

          # kafka binds 9092 before the broker answers requests, so ask it for its api versions
          ok=0
          for _ in $(seq 30); do
            if docker compose -f env/docker-compose-jobs.yaml exec -T broker \
                 kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Kafka broker did not become ready"
            docker compose -f env/docker-compose-jobs.yaml logs broker
            exit 1
          fi

          # rabbitmq is ready once the management api answers
          ok=0
          for _ in $(seq 60); do
            if curl -sf -u guest:guest http://127.0.0.1:15672/api/overview >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::RabbitMQ not ready after 120s"
            docker compose -f env/docker-compose-jobs.yaml logs rabbitmq
            exit 1
          fi

          # wait for LocalStack SQS to be ready
          ok=0
          for _ in $(seq 60); do
            if curl -sf http://localhost:4566/_localstack/health | jq -e '.services.sqs | test("^(available|running)$")' >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::LocalStack SQS not ready after 120s"
            docker compose -f env/docker-compose-jobs.yaml logs localstack
            exit 1
          fi

          go test -timeout 20m -v -race -cover -coverpkg=github.com/roadrunner-server/jobs/v6/... -coverprofile=./coverage-ci/jobs.out -covermode=atomic .
          docker compose -f env/docker-compose-jobs.yaml down
      - name: Archive code coverage results
        uses: actions/upload-artifact@v7
        with:
          name: coverage-jobs
          path: ./tests/coverage-ci

  codecov:
    name: Upload codecov
    runs-on: ubuntu-latest
    needs:
      - rr_jobs_test
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Download code coverage results
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - run: |
          echo 'mode: atomic' > summary.txt
          tail -q -n +2 coverage/*.out >> summary.txt
          awk '
            NR == 1 { print; next }
            /^github\.com\/roadrunner-server\/jobs\/v6\// {
              sub(/^github\.com\/roadrunner-server\/jobs\/v6\//, "", $0)
              print
            }
          ' summary.txt > summary.filtered.txt
          mv summary.filtered.txt summary.txt
      - name: upload to codecov
        uses: codecov/codecov-action@v7
        with:
          files: summary.txt
          fail_ci_if_error: false
