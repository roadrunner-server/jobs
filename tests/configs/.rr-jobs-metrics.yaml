version: '3'

rpc:
  listen: tcp://127.0.0.1:6381

server:
  command: "php php_test_files/jobs/jobs_ok.php"
  relay: "pipes"
  relay_timeout: "20s"

metrics:
  address: 127.0.0.1:2381

logs:
  level: info
  encoding: console
  mode: development

jobs:
  pipeline_size: 100000
  pool:
    num_workers: 1
    max_jobs: 0
    allocate_timeout: 60s
    destroy_timeout: 60s
